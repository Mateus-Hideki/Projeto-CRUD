{% extends 'core/base.html' %}

{% block title %}Cadastrar peça{% endblock %}

{% block content %}
<section class="form-shell">
  <div class="form-card">
    <div class="form-header">
      <div>
        <p class="section-kicker">Peças</p>
        <h2>{% if editando %}Editar peça{% else %}Cadastrar nova peça{% endif %}</h2>
      </div>
      <a href="/roupas/" class="btn-ghost">Voltar</a>
    </div>

    <form method="post" class="styled-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary">{% if editando %}Salvar alterações{% else %}Salvar peça{% endif %}</button>
    </form>
  </div>
</section>
{% endblock %}

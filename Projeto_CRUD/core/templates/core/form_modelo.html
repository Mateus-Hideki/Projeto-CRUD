{% extends 'core/base.html' %}

{% block title %}Novo modelo{% endblock %}

{% block content %}
<section class="form-shell">
  <div class="form-card">
    <div class="form-header">
      <div>
        <p class="section-kicker">Modelos</p>
        <h2>{% if editando %}Editar modelo{% else %}Novo modelo{% endif %}</h2>
      </div>
      <a href="/modelos/" class="btn-ghost">Voltar</a>
    </div>

    <form method="post" class="styled-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary">{% if editando %}Salvar alterações{% else %}Salvar modelo{% endif %}</button>
    </form>
  </div>
</section>
{% endblock %}
